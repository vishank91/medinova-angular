<app-navbar></app-navbar>

<div class="container-fluid my-3">
    <div class="row">
        <div class="col-lg-3">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        <div class="col-lg-9">
            <h5 class="bg-primary p-2 text-center text-light">Package <a routerLink="/admin/package/create"><i
                        class="bi bi-plus text-light float-end"></i></a></h5>
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Pic</th>
                            <th>Base Price</th>
                            <th>Discount</th>
                            <th>Final Price</th>
                            <th>Short Description</th>
                            <th>Status</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of data; track $index) {
                        <tr>
                            <td>{{item.id}}</td>
                            <td>{{item.name}}</td>
                            <td>
                                <a href="{{imageServerURL}}/{{item.pic}}" target="_blank">
                                    <img src="{{imageServerURL}}{{item.pic}}" height="60px" width="100px" alt="">
                                </a>
                            </td>
                            <td>&#8377;{{item.basePrice}}</td>
                            <td>{{item.discount}}% Off</td>
                            <td>&#8377;{{item.finalPrice}}</td>
                            <td>{{item.shortDescription}}</td>
                            <td>{{item.status?"Active":"Inactive"}}</td>
                            <td><a [routerLink]="['/admin/package/update']" [queryParams]="{id:item.id}"
                                    class="btn btn-primary"><i class="bi bi-pencil"></i></a></td>
                            <td><button class="btn btn-danger" (click)="deleteRecord(item.id)"><i
                                        class="bi bi-trash"></i></button></td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<app-footer></app-footer>
